<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo · EMPREST.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design system Nocturne + override EMPREST.AI — layout.md §1-§4 */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --color-bg:#161826;--color-surface:#232532;--color-text:#e9e9ed;
  --color-divider:rgba(233,233,237,.16);
  --color-neutral-900:#292b31;
  --accent-100:#e6faf7;--accent-200:#c2f1eb;--accent-300:#93e3da;--accent-400:#5fcfc4;
  --accent-500:#2fb8ac;--accent-600:#26978e;--accent-700:#1d746d;--accent-800:#15534e;--accent-900:#0f3733;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(10,11,18,.35);
  --shadow-md:0 4px 12px rgba(10,11,18,.32);
  --shadow-lg:0 12px 32px rgba(10,11,18,.45);
  --font:'Raleway',system-ui,-apple-system,sans-serif;
}
html,body{margin:0}
body{min-height:820px;background:var(--color-bg);color:var(--color-text);font:400 14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button{font-family:var(--font)}
:focus-visible{outline:2px solid var(--accent-500);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* navegação — layout.md §6 */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:32px;height:60px;padding:0 40px;background:var(--color-bg);border-bottom:1px solid var(--color-divider)}
.brand{display:flex;align-items:center;gap:8.4px;flex:none}
.brand-mark{width:22px;height:22px;flex:none;border:1.5px solid var(--accent-500);border-radius:6px;position:relative}
.brand-mark::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:2px;background:var(--accent-500)}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.02em}
.brand-name .ai{color:var(--accent-400)}
.nav-tabs{display:flex;align-self:stretch}
.tab{display:flex;align-items:center;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;color:rgba(233,233,237,.55);font-size:13.5px;font-weight:500;cursor:pointer}
.tab:hover{color:rgba(233,233,237,.8)}
.tab.active{color:var(--color-text);border-bottom-color:var(--accent-500)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:11.2px}
.tag-outline{padding:3px 9px;border:1px solid var(--color-divider);border-radius:999px;font-size:11.5px;font-weight:500;color:rgba(233,233,237,.55);white-space:nowrap}
.avatar{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--accent-900);border:1px solid var(--accent-700);color:var(--accent-300);font-size:11.5px;font-weight:600}
.nav-user{font-size:13.5px}
.nav-exit{border:0;background:none;padding:4px 6px;color:rgba(233,233,237,.55);font-size:13px;font-weight:500;cursor:pointer;border-radius:var(--radius-sm)}
.nav-exit:hover{color:var(--accent-300)}

/* página — layout.md §3 */
.page{max-width:1240px;margin:0 auto;padding:36px 40px 64px}
.page-body{display:flex;flex-direction:column;gap:16.8px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16.8px;flex-wrap:wrap}
.head-left{display:flex;flex-direction:column;gap:2.8px}
h1{margin:0;font-size:30px;font-weight:600;line-height:1.12;letter-spacing:-.015em}
.lead{margin:0;font-size:14px;color:rgba(233,233,237,.55)}
.search{width:260px}
.input{width:100%;height:36px;padding:6px 10px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);color:var(--color-text);font:400 13.5px/1.2 var(--font)}
.input::placeholder{color:rgba(233,233,237,.4)}

/* banner de bloqueio — layout.md §1/§5.2 */
.banner{display:flex;align-items:center;justify-content:space-between;gap:11.2px;padding:14px 18px;border:1px solid #7a3b3b;background:rgba(122,59,59,.14);border-radius:var(--radius-lg);color:#e88b8b;font-size:13.5px}
.btn-danger{flex:none;height:30px;padding:0 11.2px;border:1px solid #7a3b3b;border-radius:var(--radius-md);background:none;color:#e88b8b;font-size:12.5px;font-weight:500;cursor:pointer}
.btn-danger:hover{background:rgba(122,59,59,.18)}

/* chips de filtro — layout.md §5.2/§7 */
.chips{display:flex;flex-wrap:wrap;gap:8.4px}
.chip{padding:5.6px 11.2px;border:1px solid var(--color-divider);border-radius:999px;background:none;color:rgba(233,233,237,.55);font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{background:rgba(233,233,237,.05)}
.chip.active{border-color:var(--accent-500);color:var(--accent-300);background:rgba(47,184,172,.10)}

/* botões — layout.md §4 */
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:var(--radius-md);font-size:13.5px;font-weight:500;cursor:pointer;background:none;transition:background .15s ease}
.btn-primary{border:1px solid var(--accent-500);color:var(--accent-300)}
.btn-primary:hover{background:rgba(47,184,172,.12)}
.btn-primary:active{background:rgba(47,184,172,.22)}
.btn-secondary{border:1px solid var(--color-divider);color:var(--color-text)}
.btn-secondary:hover{background:rgba(233,233,237,.06)}
.btn-ghost{border:1px solid transparent;color:var(--accent-300)}
.btn-ghost:hover{background:rgba(47,184,172,.10)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:none}
/* grade de cards — layout.md §3/§5.2 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);animation:fadeUp .25s ease both}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8.4px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(233,233,237,.45)}
.card-title{margin:0;font-size:16.5px;font-weight:600;line-height:1.12;letter-spacing:-.015em}
.patrimonio{font-size:12px;font-weight:500;color:rgba(233,233,237,.45)}
.pill{padding:3px 9px;border:1px solid transparent;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill-disponivel{color:#5fcfc4;background:rgba(47,184,172,.12);border-color:rgba(47,184,172,.4)}
.pill-emprestado{color:#c9a25f;background:rgba(201,162,95,.12);border-color:rgba(201,162,95,.38)}
.pill-manutencao{color:#9aa0ad;background:rgba(154,160,173,.1);border-color:rgba(154,160,173,.3)}
.detail{min-height:18px;font-size:12.5px;color:rgba(233,233,237,.55)}
.detail .due{color:#c9a25f}
.empty{padding:48px;border:1.5px dashed var(--color-divider);border-radius:var(--radius-lg);text-align:center;font-size:13.5px;color:rgba(233,233,237,.55)}

/* modal — layout.md §5.6 */
.backdrop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,11,18,.68)}
.dialog{display:flex;flex-direction:column;gap:11.2px;width:420px;max-width:calc(100vw - 32px);padding:26px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);animation:fadeUp .18s ease both}
.dialog-title{margin:0;font-size:20px;font-weight:600;line-height:1.12;letter-spacing:-.015em}
.dialog-body{margin:0;font-size:13.5px;color:rgba(233,233,237,.62)}
.summary{display:flex;flex-direction:column;gap:8.4px;padding:14px 16px;border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.summary-row{display:flex;justify-content:space-between;gap:11.2px;font-size:13.5px}
.summary-row .k{color:rgba(233,233,237,.45)}
.summary-row .v{color:var(--accent-300);font-weight:600;text-align:right}
.dialog-actions{display:flex;justify-content:flex-end;gap:8.4px;margin-top:5.6px}

/* toast — layout.md §5.6/§8 */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;padding:12px 20px;border:1px solid var(--accent-700);border-radius:999px;background:var(--accent-900);color:var(--accent-200);font-size:13.5px;box-shadow:var(--shadow-md);animation:toastIn .2s ease both}

/* controles de protótipo — layout.md §10 */
.proto{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;align-items:center;gap:11.2px;padding:8.4px 11.2px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-md);font-size:11px;color:rgba(233,233,237,.45)}
.proto label{display:flex;align-items:center;gap:5.6px}
.proto select{height:24px;padding:0 4px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-sm);color:var(--color-text);font-size:11px}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand"><span class="brand-mark"></span><span class="brand-name">EMPREST<span class="ai">.AI</span></span></div>
  <div class="nav-tabs" id="tabs"></div>
  <div class="nav-right">
    <span class="tag-outline" id="roleTag">Colaborador</span>
    <span class="avatar">AR</span>
    <span class="nav-user">Ana Ribeiro</span>
    <button class="nav-exit" id="exit">Sair</button>
  </div>
</nav>

<main class="page">
  <div class="page-body">
    <div class="page-head">
      <div class="head-left">
        <h1>Catálogo</h1>
        <p class="lead" id="count"></p>
      </div>
      <div class="search">
        <input class="input" id="search" type="text" placeholder="Buscar por nome ou patrimônio" aria-label="Buscar equipamento">
      </div>
    </div>
    <div id="bannerSlot"></div>
    <div class="chips" id="chips"></div>
    <section class="grid" id="grid"></section>
    <div id="emptySlot"></div>
  </div>
</main>
<div class="backdrop" id="backdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 class="dialog-title" id="dlgTitle">Solicitar empréstimo</h2>
    <p class="dialog-body">O item fica registrado no seu nome e conta para o limite de 3 empréstimos simultâneos.</p>
    <div class="summary">
      <div class="summary-row"><span class="k">Equipamento</span><span class="v" id="dlgItem"></span></div>
      <div class="summary-row"><span class="k">Devolver até</span><span class="v" id="dlgUntil"></span></div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="dlgCancel">Cancelar</button>
      <button class="btn btn-primary" id="dlgConfirm">Solicitar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="proto" title="Controles de protótipo — layout.md §10">
  <label>papel <select id="protoRole"><option value="colaborador">Colaborador</option><option value="operacoes">Operações</option></select></label>
  <label>demo <select id="protoDemo"><option value="none">normal</option><option value="atraso">atraso (bloqueado)</option><option value="toast">toast</option></select></label>
</div>

<script>
// Dados de exemplo e data de referência — layout.md §9
const REF = new Date(2026, 7, 31); // 31/08/2026
const fmt = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DUE = fmt(addDays(REF, 14)); // 14/09/2026

const state = { role:'colaborador', query:'', filter:'todos', demo:'none', pending:null };

const items = [
  {id:1, nome:'Notebook Dell Latitude 5450', categoria:'Notebook', patrimonio:'TI-0142', situacao:'disponivel'},
  {id:2, nome:'MacBook Pro 14 M3', categoria:'Notebook', patrimonio:'TI-0088', situacao:'emprestado', holder:'Marcos Lemos', ate:'07/09/2026'},
  {id:3, nome:'Monitor LG 27" 4K', categoria:'Monitor', patrimonio:'TI-0231', situacao:'disponivel'},
  {id:4, nome:'Monitor Dell 24" FHD', categoria:'Monitor', patrimonio:'TI-0233', situacao:'manutencao', obs:'Painel com falha, retorna em 05/09'},
  {id:5, nome:'Câmera Sony ZV-1', categoria:'Câmera', patrimonio:'TI-0301', situacao:'emprestado', holder:'Ana Ribeiro', mine:true, ate:'12/09/2026'},
  {id:6, nome:'Cabo HDMI 2.1 3m', categoria:'Cabo', patrimonio:'TI-0455', situacao:'disponivel'},
  {id:7, nome:'Dock Thunderbolt 4', categoria:'Acessório', patrimonio:'TI-0512', situacao:'emprestado', holder:'Ana Ribeiro', mine:true, ate:'05/09/2026'},
  {id:8, nome:'Tripé Manfrotto Befree', categoria:'Acessório', patrimonio:'TI-0318', situacao:'manutencao', obs:'Trava do centro quebrada'},
  {id:9, nome:'Headset Jabra Evolve2', categoria:'Acessório', patrimonio:'TI-0402', situacao:'disponivel'}
];

const TABS = {
  colaborador: [['catalogo','Catálogo'],['meus','Meus empréstimos']],
  operacoes: [['catalogo','Catálogo'],['operacoes','Operações'],['equipamentos','Equipamentos'],['meus','Meus empréstimos']]
};
const CHIPS = [['todos','Todos'],['disponiveis','Disponíveis'],['emprestados','Emprestados'],['manutencao','Em manutenção']];
const $ = id => document.getElementById(id);
const mineCount = () => items.filter(i => i.mine).length;
const blocked = () => state.demo === 'atraso';
const canBorrow = () => !blocked() && mineCount() < 3;
const availableCount = () => items.filter(i => i.situacao === 'disponivel').length;

// card — layout.md §5.2: kicker · nome · patrimônio · pill à direita · detalhe (min-height 18px) · botão
function cardHTML(it){
  let pill, detail, btn;
  if (it.situacao === 'disponivel'){
    pill = '<span class="pill pill-disponivel">Disponível</span>';
    detail = 'Pronto para retirada no balcão';
    btn = '<button class="btn btn-primary btn-block" data-solicitar="' + it.id + '"' + (canBorrow() ? '' : ' disabled') + '>Solicitar</button>';
  } else if (it.situacao === 'emprestado'){
    pill = '<span class="pill pill-emprestado">Emprestado</span>';
    const quem = it.mine ? 'Com você' : 'Com ' + it.holder;
    detail = quem + ' · devolver até <span class="due">' + it.ate + '</span>';
    btn = '<button class="btn btn-secondary btn-block" disabled>' + (it.mine ? 'Está com você' : 'Emprestado') + '</button>';
  } else {
    pill = '<span class="pill pill-manutencao">Em manutenção</span>';
    detail = it.obs;
    btn = '<button class="btn btn-secondary btn-block" disabled>Indisponível</button>';
  }
  return '<article class="card">' +
    '<div class="card-top"><span class="kicker">' + it.categoria + '</span>' + pill + '</div>' +
    '<h3 class="card-title">' + it.nome + '</h3>' +
    '<span class="patrimonio">' + it.patrimonio + '</span>' +
    '<div class="detail">' + detail + '</div>' +
    btn + '</article>';
}

// busca (nome + patrimônio, case-insensitive, imediata) e filtro exclusivo — layout.md §7
function visible(){
  const q = state.query.trim().toLowerCase();
  return items.filter(it => {
    if (state.filter === 'disponiveis' && it.situacao !== 'disponivel') return false;
    if (state.filter === 'emprestados' && it.situacao !== 'emprestado') return false;
    if (state.filter === 'manutencao' && it.situacao !== 'manutencao') return false;
    if (q && !(it.nome.toLowerCase().includes(q) || it.patrimonio.toLowerCase().includes(q))) return false;
    return true;
  });
}

function render(){
  // navegação por papel — layout.md §6
  $('roleTag').textContent = state.role === 'operacoes' ? 'Operações' : 'Colaborador';
  $('tabs').innerHTML = TABS[state.role].map(([id, label]) =>
    '<button class="tab' + (id === 'catalogo' ? ' active' : '') + '" data-tab="' + id + '">' + label + '</button>').join('');
  // contagem — layout.md §5.2
  $('count').textContent = availableCount() + ' de ' + items.length + ' equipamentos disponíveis agora';
  // banner de bloqueio (condicional) — layout.md §1/§7
  $('bannerSlot').innerHTML = blocked()
    ? '<div class="banner"><span>Você tem um item em atraso. Devolva-o para solicitar novos empréstimos.</span>' +
      '<button class="btn-danger" id="bannerGo">Ver meus empréstimos</button></div>'
    : '';
  $('chips').innerHTML = CHIPS.map(([id, label]) =>
    '<button class="chip' + (state.filter === id ? ' active' : '') + '" data-filter="' + id + '">' + label + '</button>').join('');
  const list = visible();
  $('grid').innerHTML = list.map(cardHTML).join('');
  $('emptySlot').innerHTML = list.length ? '' :
    '<div class="empty">Nenhum equipamento encontrado para a busca ou o filtro atual.</div>';
}

let toastTimer;
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600); // layout.md §8
}

function openModal(it){
  state.pending = it;
  $('dlgItem').textContent = it.nome;
  $('dlgUntil').textContent = DUE; // hoje + 14 dias — layout.md §7
  $('backdrop').hidden = false;
}
function closeModal(){
  state.pending = null;
  $('backdrop').hidden = true;
}
function confirmBorrow(){
  const it = state.pending;
  if (!it) return;
  it.situacao = 'emprestado';
  it.mine = true;
  it.holder = 'Ana Ribeiro';
  it.ate = DUE;
  closeModal();
  render();
  showToast('Empréstimo registrado. Devolva até ' + DUE + '.');
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){
    if (tab.dataset.tab !== 'catalogo') showToast('Tela não incluída neste protótipo — apenas o Catálogo.');
    return;
  }
  if (e.target.closest('#exit')){ showToast('Tela de login não incluída neste protótipo.'); return; }
  const chip = e.target.closest('[data-filter]');
  if (chip){ state.filter = chip.dataset.filter; render(); return; }
  const req = e.target.closest('[data-solicitar]');
  if (req){ openModal(items.find(i => i.id === Number(req.dataset.solicitar))); return; }
  if (e.target.closest('#dlgCancel')){ closeModal(); return; }
  if (e.target.closest('#dlgConfirm')){ confirmBorrow(); return; }
  if (e.target.closest('#bannerGo')){ showToast('Tela Meus empréstimos não incluída neste protótipo.'); return; }
  if (e.target === $('backdrop')) closeModal(); // clique fora fecha; dentro não propaga — layout.md §5.6
});

$('search').addEventListener('input', e => { state.query = e.target.value; render(); });
$('protoRole').addEventListener('change', e => { state.role = e.target.value; render(); });
$('protoDemo').addEventListener('change', e => {
  const v = e.target.value;
  if (v === 'toast'){
    showToast('Protótipo: toast de exemplo.');
    e.target.value = 'none';
    state.demo = 'none';
  } else {
    state.demo = v;
  }
  render();
});

render();
</script>
</body>
</html>
